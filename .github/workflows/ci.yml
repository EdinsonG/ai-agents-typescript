name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Build · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Audit de dependencias (falla con vulnerabilidades high)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests unitarios
        run: npm test

  evals:
    name: Evals con Groq (opcional)
    needs: quality
    # Se activa creando la variable de repositorio RUN_EVALS=true
    # y configurando el secret GROQ_API_KEY_AGENTS
    if: ${{ vars.RUN_EVALS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar evals contra Groq
        run: npm run evals
        env:
          GROQ_API_KEY_AGENTS: ${{ secrets.GROQ_API_KEY_AGENTS }}
