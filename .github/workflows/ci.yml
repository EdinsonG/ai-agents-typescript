name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Lint · Build · Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # Lee la versión desde el campo packageManager de package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Audit de dependencias (falla con vulnerabilidades high)
        if: matrix.node-version == 22
        run: pnpm audit --audit-level high

      - name: Lint (Biome)
        if: matrix.node-version == 22
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Tests con cobertura
        if: matrix.node-version == 22
        run: pnpm test:coverage

      - name: Tests (sin cobertura)
        if: matrix.node-version != 22
        run: pnpm test

      - name: Subir coverage a Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  evals:
    name: Evals con Groq (opcional)
    needs: quality
    # Se activa creando la variable de repositorio RUN_EVALS=true
    # y configurando el secret GROQ_API_KEY_AGENTS
    if: ${{ vars.RUN_EVALS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar evals contra Groq
        run: pnpm evals
        env:
          GROQ_API_KEY_AGENTS: ${{ secrets.GROQ_API_KEY_AGENTS }}
