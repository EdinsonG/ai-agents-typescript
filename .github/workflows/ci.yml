name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Build · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lee la versión desde el campo packageManager de package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Audit de dependencias (falla con vulnerabilidades high)
        run: pnpm audit --audit-level high

      - name: Lint (Biome)
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Tests unitarios
        run: pnpm test

  evals:
    name: Evals con Groq (opcional)
    needs: quality
    # Se activa creando la variable de repositorio RUN_EVALS=true
    # y configurando el secret GROQ_API_KEY_AGENTS
    if: ${{ vars.RUN_EVALS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar evals contra Groq
        run: pnpm evals
        env:
          GROQ_API_KEY_AGENTS: ${{ secrets.GROQ_API_KEY_AGENTS }}
